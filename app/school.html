<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safetify - Emergency Service School</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --bg: #f5f3ff; --text-main: #1e1b4b; --text-muted: #6d6a7c; --border: #e9e4ff; }
        body, html { margin: 0; padding: 0; background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); }
        .header { background: white; padding: 60px 24px 30px; border-radius: 0 0 32px 32px; box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.1); }
        .header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .header p { margin: 8px 0 0; color: var(--text-muted); font-size: 15px; font-weight: 500; }
        .content { padding: 24px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }
        .course-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); display: flex; align-items: center; gap: 16px; cursor: pointer; }
        .course-icon { width: 50px; height: 50px; background: var(--bg); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; }
        .course-info h3 { margin: 0; font-size: 16px; font-weight: 700; }
        .course-info p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .progress-bar { height: 6px; background: #ede9fe; border-radius: 3px; margin-top: 12px; position: relative; overflow: hidden; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary); border-radius: 3px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: white; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid var(--border); padding-bottom: 10px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 20px; gap: 4px; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 11px; font-weight: 700; }
        .announcement { background: linear-gradient(135deg, #8b5cf6, #d946ef); color: white; padding: 20px; border-radius: 20px; margin-bottom: 24px; position: relative; overflow: hidden; }
        .announcement h4 { margin: 0; font-size: 18px; font-weight: 800; }
        .announcement p { margin: 8px 0 0; font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div><h1>School Desk</h1><p>Welcome back, <span id="student-name">Student</span></p></div>
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--primary); padding: 2px;"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" style="width: 100%; height: 100%; border-radius: 50%;"></div>
    </div>
</div>

<div class="content">
    <div class="announcement">
        <h4>Practical Exam Today</h4>
        <p>Advanced Life Support (ALS) simulation starts at 14:00 in Room 4.</p>
        <i class="fa-solid fa-graduation-cap" style="position: absolute; right: -10px; bottom: -10px; font-size: 80px; opacity: 0.2;"></i>
    </div>
    <div class="section-title"><i class="fa-solid fa-book-open"></i> My Courses</div>
    <div class="course-card">
        <div class="course-icon"><i class="fa-solid fa-heart-pulse"></i></div>
        <div style="flex: 1;"><div class="course-info"><h3>Paramedic Fundamentals</h3><p>Module 4: Airway Management</p></div><div class="progress-bar"><div class="progress-fill" style="width: 75%;"></div></div></div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></div>
    <div class="nav-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></div>
</div>

<script>
    document.getElementById('student-name').innerText = localStorage.getItem('userName') || "Student";
    function logout() { localStorage.clear(); window.location.replace("login.html"); }
</script>

</body>
</html>
